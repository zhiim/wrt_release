name: Build Athena LibWrt
run-name: Athena LibWrt - Docker + IPsec + EC20

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after the build
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: athena-libwrt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl zstd libelf-dev \
            autoconf automake libtool pkg-config cmake ninja-build ccache

      - name: Configure and validate Athena
        run: bash ./wrt_core/pre_clone_action.sh

      # Cache downloads and compiler results only. Do not reuse staging_dir
      # or touch its stamps across different kernels, feeds or configurations.
      - name: Cache downloads and compiler results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            action_build/dl
            action_build/.ccache
          key: athena-libwrt-${{ runner.os }}-${{ hashFiles('action_build/feeds.buildinfo', 'wrt_core/deconfig/**/*.config', 'wrt_core/compilecfg/jdcloud_ipq60xx_libwrt.ini') }}-${{ github.run_id }}
          restore-keys: |
            athena-libwrt-${{ runner.os }}-${{ hashFiles('action_build/feeds.buildinfo', 'wrt_core/deconfig/**/*.config', 'wrt_core/compilecfg/jdcloud_ipq60xx_libwrt.ini') }}-
            athena-libwrt-${{ runner.os }}-

      - name: Build and verify firmware manifest
        run: bash ./build.sh compile

      - name: Upload firmware, configuration and matching packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: athena-libwrt-${{ github.run_number }}
          path: firmware/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: athena-build-diagnostics-${{ github.run_number }}
          path: |
            action_build/.config
            action_build/build-info.txt
            action_build/feeds.buildinfo
            action_build/logs/
          if-no-files-found: ignore

  release:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: athena-libwrt-${{ github.run_number }}
          path: firmware
      - name: Publish Athena firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="athena-libwrt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<'NOTES'
          京东云雅典娜 / RE-CS-02 专用 LibWrt 固件。
          保留基础路由、Wi-Fi、LuCI、Docker、IPsec/XFRM 和 EC20 USB 支持。
          不包含额外 DNS、代理、打印或 NAS 插件。
          packages-athena.tar.gz 包含本次构建的匹配软件包；内核模块不能与其他固件混用。
          构建使用的源码提交与 feeds 版本见 build-info.txt 和 feeds.buildinfo。
          NOTES
          gh release create "$tag" firmware/* --repo "$GH_REPO" \
            --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
